services:
  - type: web
    name: safar
    runtime: python
    buildCommand: bash ./render_build.sh
    startCommand: gunicorn --worker-class gthread --threads 100 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # ThingSpeak IoT tracker. The channel is private, so the poller needs
      # the channel's Read API Key — set it in the Render dashboard.
      - key: THINGSPEAK_CHANNEL_ID
        value: "3465207"
      - key: THINGSPEAK_READ_API_KEY
        sync: false
      - key: THINGSPEAK_POLL_SECONDS
        value: "10"
      # Blynk is no longer polled; kept for the legacy webhook endpoint.
      - key: BLYNK_AUTH_TOKEN
        sync: false
      - key: BLYNK_TEMPLATE_ID
        sync: false
      - key: BLYNK_TEMPLATE_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
